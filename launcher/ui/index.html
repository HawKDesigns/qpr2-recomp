<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ATV Quad Power Racing 2 · QPR2 Launcher</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="music.css">
</head>
<body data-page="play" data-input="kbd">
  <div id="bg"><div class="bg-fallback"></div><div class="bg-img"></div><div class="bg-stripes"></div><div class="bg-scrim"></div></div>
  <div id="app">
    <header id="top">
      <div class="brand" id="brand"></div>
      <div class="chips" id="chips"></div>
    </header>
    <nav id="nav" aria-label="Pages"></nav>
    <main id="main"><div id="page" class="page"></div></main>
    <footer id="foot"><div id="prompts"></div><div id="tip"></div></footer>
  </div>
  <div id="overlay" role="dialog" aria-modal="true"></div>
  <div id="toasts" aria-live="polite"></div>
  <script defer src="music.js"></script>
  <script defer src="app.js"></script>
</body>
</html>
