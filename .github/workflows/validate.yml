name: validate

on:
  push:
  pull_request:

jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Compile Python tooling
        run: >-
          python3 -m py_compile
          tools/qpr2_pipeline.py
          tools/qpr2_debug_metadata.py
          tools/qpr2_frame_trace.py
          tools/qpr2_link_check.py
          tools/qpr2_run_posix.py
          tools/bootstrap_xboxrecomp.py
          tools/tests/test_qpr2_pipeline.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tools/tests -v
      - name: Generate the generic GPU shader header
        run: >-
          cmake -DINPUT_ROOT="${GITHUB_WORKSPACE}/third_party/xboxrecomp/src/kernel"
          -P third_party/xboxrecomp/src/kernel/embed_qpr2_gpu_shader.cmake
      - name: Check active runtime paths with local fixtures
        run: |
          gcc -std=c11 -O2 -fsanitize=undefined -fno-sanitize-recover=all tools/test_qpr2_frame_clock.c -o "$RUNNER_TEMP/qpr2-frame-clock"
          "$RUNNER_TEMP/qpr2-frame-clock"
          python3 tools/test_qpr2_present_lock.py
          gcc -std=gnu11 -O2 -fsanitize=undefined -fno-sanitize-recover=all -ffunction-sections -fdata-sections -Ithird_party/xboxrecomp/src tools/test_qpr2_display_modes.c third_party/xboxrecomp/src/kernel/kernel_xbox.c -Wl,--gc-sections -o "$RUNNER_TEMP/qpr2-display-modes"
          "$RUNNER_TEMP/qpr2-display-modes"
          python3 tools/test_qpr2_surface_copy.py
          python3 tools/test_qpr2_completion_token.py
          python3 tools/test_qpr2_readback_queue.py
      - name: Link the title against the runtime without game code (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsdl2-dev libssl-dev
          python3 tools/qpr2_link_check.py
      - name: Cross-link the Windows configuration (MinGW-w64)
        run: |
          sudo apt-get install -y gcc-mingw-w64-x86-64-win32 g++-mingw-w64-x86-64-win32
          python3 tools/qpr2_link_check.py --toolchain tools/mingw-w64-x86_64.cmake
      - name: Reject accidentally committed retail or generated files
        shell: bash
        run: |
          test -z "$(git ls-files -- game/default.xbe 'src/recomp/gen/*.c')"

