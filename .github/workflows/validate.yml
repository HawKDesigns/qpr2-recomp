name: validate

on:
  push:
  pull_request:

jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python tooling
        run: >-
          python3 -m py_compile
          tools/qpr2_pipeline.py
          tools/bootstrap_xboxrecomp.py
          tools/tests/test_qpr2_pipeline.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tools/tests -v
      - name: Reject accidentally committed retail or generated files
        shell: bash
        run: |
          test ! -f game/default.xbe
          test -z "$(find src/recomp/gen -type f -name '*.c' -print -quit)"

